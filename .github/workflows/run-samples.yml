name: run-samples

# Headless sample runner (honua-io/honua-samples#2). Composes honua-server +
# PostGIS, waits for readiness, executes every "active" sample's entrypoint
# against it, and uploads the result envelope. Also generates and uploads
# samples-coverage.v1.json (honua-io/honua-samples#5) -- the producer
# snapshot honua-evidence's capability matrix ingests -- joining the run
# results with the sample manifests.
#
# #2's three deferred items now land here:
#   - a headless-browser lane (entrypoint.type: "browser",
#     scripts/lib/browser-lane.mjs) for JS/SDK samples that need real DOM/
#     fetch behavior, not just a Node child process. Each browser sample is
#     proven by its Playwright specs (samples/<id>/verify/*.spec.mjs,
#     playwright.config.ts, docs/browser-verification/) against this job's
#     composed server: Chromium only, one attempt, retries 0 -- a failed spec
#     fails the job. Per-sample run-results.v1 envelopes are uploaded always;
#     traces and screenshots exist (and are uploaded) only when a spec failed.
#   - a runner edition filter. The optional HONUA_LICENSE_DEV_GRANT_EDITION
#     secret only selects --edition pro and stacks docker/compose.pro.yml.
#     That overlay repeats Licensing__Mode=Disabled; it does not grant an
#     edition. Absent the secret, higher-edition samples are recorded
#     "skipped" (never failed, never silently omitted).
#   - per-sample retry with both attempts recorded in the result envelope
#     (attempts[], flaky) -- see schemas/run-results.v1.schema.json.
#
# Still deferred for #5: dispatching/pushing the samples-coverage snapshot to
# honua-evidence -- that repo's ingest pipeline doesn't exist yet
# (honua-io/honua-evidence#3). For now this only publishes the artifact on
# this repo's own runs; honua-evidence will pull it once its side lands.
on:
  pull_request:
    paths:
      - "samples/**"
      - "scripts/run-samples.mjs"
      - "scripts/generate-samples-coverage.mjs"
      - "scripts/lib/**"
      - "scripts/browser-verification/**"
      - "schemas/samples-coverage.v1.schema.json"
      - "docker/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/run-samples.yml"
  push:
    branches: [trunk]
    paths:
      - "samples/**"
      - "scripts/run-samples.mjs"
      - "scripts/generate-samples-coverage.mjs"
      - "scripts/lib/**"
      - "scripts/browser-verification/**"
      - "schemas/samples-coverage.v1.schema.json"
      - "docker/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/run-samples.yml"
  schedule:
    - cron: "17 5 * * *" # nightly
  workflow_dispatch: {}

env:
  HONUA_ADMIN_PASSWORD: quickstart-admin-password
  HONUA_ADMIN_API_KEY: quickstart-admin-password
  HONUA_BASE_URL: http://localhost:8080
  HONUA_PUBLIC_BASE_URL: https://demo.honua.io

jobs:
  run:
    name: run active samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install sample runner dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Determine edition
        # --edition only chooses which manifest editions the runner executes.
        # The optional secret is that selector. It is not passed to Compose
        # and it is not a server license. 2026.1 compose sets
        # Licensing__Mode=Disabled; docker/compose.pro.yml repeats that.
        id: edition
        env:
          HAS_EDITION_SELECTOR: ${{ secrets.HONUA_LICENSE_DEV_GRANT_EDITION != '' }}
        run: |
          if [ "$HAS_EDITION_SELECTOR" = "true" ]; then
            echo "edition=pro" >> "$GITHUB_OUTPUT"
            echo "compose_files=-f docker/compose.yml -f docker/compose.pro.yml" >> "$GITHUB_OUTPUT"
            echo "run-samples: edition selector is set -- stacking docker/compose.pro.yml (Licensing__Mode=Disabled) and running as --edition pro"
          else
            echo "edition=community" >> "$GITHUB_OUTPUT"
            echo "compose_files=-f docker/compose.yml" >> "$GITHUB_OUTPUT"
            echo "run-samples: no edition selector configured -- running as --edition community; higher-edition samples will be recorded \"skipped\", not failed"
          fi

      - name: Compose up (postgres + honua-server)
        # Image and licensing come from docker/compose.yml: the 2026.1
        # candidate digest and Licensing__Mode=Disabled. HONUA_SERVER_IMAGE
        # may override the image. The floating :trunk tag is not this release.
        run: docker compose ${{ steps.edition.outputs.compose_files }} up -d

      - name: Run active samples
        run: node scripts/run-samples.mjs --edition ${{ steps.edition.outputs.edition }}

      - name: Dump honua-server logs on failure
        if: failure()
        run: docker compose ${{ steps.edition.outputs.compose_files }} logs honua

      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-results
          path: results/run-results.v1.json
          if-no-files-found: warn

      - name: Upload browser verification results
        # One run-results.v1 envelope per browser sample, plus its per-spec
        # results and the raw Playwright JSON report.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-results
          path: results/browser-verification/*.json
          if-no-files-found: warn

      - name: Upload browser verification traces
        # playwright.config.ts retains traces and screenshots only for failed
        # specs, so this only has content when a browser sample failed.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-traces
          path: results/browser-verification/artifacts
          if-no-files-found: ignore

      - name: Summarize flaky samples (nightly)
        # Only meaningful on the nightly schedule -- PR/push runs are small
        # enough today that a flake should just be looked at directly, but
        # nightly is unattended, so flaky (pass-only-after-retry) samples get
        # called out in the job summary rather than silently disappearing
        # into a green checkmark.
        if: always() && github.event_name == 'schedule'
        run: node scripts/summarize-flaky.mjs

      - name: Generate samples-coverage.v1.json
        # Runs even if a sample failed above (run-samples.mjs still writes
        # results/run-results.v1.json and exits non-zero -- the coverage
        # snapshot should still reflect what did/didn't pass) and even if the
        # server never composed at all (results file absent -- the generator
        # tolerates that and emits coverage without lastRun info). Validates
        # capability keys the same way scripts/validate-manifests.mjs does.
        # KEY_LIST_URL is the published list at the 2026.1 server pin.
        # An empty value would fall back to the offline fixture.
        if: always()
        env:
          KEY_LIST_URL: https://raw.githubusercontent.com/honua-io/honua-server/0e03bdd06b3ca3fb1b82388110bb5dfa19b9f8fa/docs/gis/data/capability-keys.v1.json
        run: node scripts/generate-samples-coverage.mjs

      - name: Upload samples-coverage snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samples-coverage
          path: coverage/samples-coverage.v1.json
          if-no-files-found: warn

      - name: Compose down
        if: always()
        run: docker compose ${{ steps.edition.outputs.compose_files }} down -v
