name: run-samples

# Headless sample runner (scaffold for honua-io/honua-samples#2). Composes
# honua-server + PostGIS, waits for readiness, executes every "active"
# sample's entrypoint against it, and uploads the result envelope. Also
# generates and uploads samples-coverage.v1.json (honua-io/honua-samples#5)
# -- the producer snapshot honua-evidence's capability matrix ingests --
# joining the run results with the sample manifests.
#
# EXPECTED TO ITERATE: this proves the loop end-to-end with the one reference
# sample (hello-featureserver-rest, Community edition, plain REST). Not yet
# covered (see honua-io/honua-samples#2 acceptance criteria):
#   - nightly schedule tuning / flake handling once there are more samples
#   - a headless-browser lane for future JS/SDK samples
#   - a Pro-licensed compose profile + CI license secret for edition-gated
#     samples
# Also deferred for #5: dispatching/pushing the samples-coverage snapshot to
# honua-evidence -- that repo's ingest pipeline doesn't exist yet
# (honua-io/honua-evidence#3). For now this only publishes the artifact on
# this repo's own runs; honua-evidence will pull it once its side lands.
on:
  pull_request:
    paths:
      - "samples/**"
      - "scripts/run-samples.mjs"
      - "scripts/generate-samples-coverage.mjs"
      - "scripts/lib/**"
      - "schemas/samples-coverage.v1.schema.json"
      - "docker/**"
      - ".github/workflows/run-samples.yml"
  push:
    branches: [trunk]
    paths:
      - "samples/**"
      - "scripts/run-samples.mjs"
      - "scripts/generate-samples-coverage.mjs"
      - "scripts/lib/**"
      - "schemas/samples-coverage.v1.schema.json"
      - "docker/**"
      - ".github/workflows/run-samples.yml"
  schedule:
    - cron: "17 5 * * *" # nightly
  workflow_dispatch: {}

env:
  HONUA_ADMIN_PASSWORD: quickstart-admin-password
  HONUA_ADMIN_API_KEY: quickstart-admin-password
  HONUA_BASE_URL: http://localhost:8080

jobs:
  run:
    name: run active samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compose up (postgres + honua-server)
        # HONUA_SERVER_IMAGE lets this pin a different tag/digest without
        # editing docker/compose.yml; defaults to the trunk-tracking GHCR
        # image (no versioned release exists yet -- see docker/compose.yml).
        run: docker compose -f docker/compose.yml up -d

      - name: Run active samples
        run: node scripts/run-samples.mjs

      - name: Dump honua-server logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml logs honua

      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-results
          path: results/run-results.v1.json
          if-no-files-found: warn

      - name: Generate samples-coverage.v1.json
        # Runs even if a sample failed above (run-samples.mjs still writes
        # results/run-results.v1.json and exits non-zero -- the coverage
        # snapshot should still reflect what did/didn't pass) and even if the
        # server never composed at all (results file absent -- the generator
        # tolerates that and emits coverage without lastRun info). Validates
        # capability keys the same way scripts/validate-manifests.mjs does:
        # KEY_LIST_URL when the honua-server#2893 artifact is set as a
        # repo/org variable, falling back to the pinned fixture otherwise.
        if: always()
        env:
          KEY_LIST_URL: ${{ vars.KEY_LIST_URL }}
        run: node scripts/generate-samples-coverage.mjs

      - name: Upload samples-coverage snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samples-coverage
          path: coverage/samples-coverage.v1.json
          if-no-files-found: warn

      - name: Compose down
        if: always()
        run: docker compose -f docker/compose.yml down -v
