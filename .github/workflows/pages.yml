name: pages

# Builds the samples.honua.io gallery (honua-io/honua-samples#3) fresh on
# every deploy via scripts/build-gallery.mjs, then publishes site/ as-is.
# Every *.html under site/ is therefore build output, not committed (see
# .gitignore) -- only site/CNAME and site/.nojekyll are tracked.
#
# The dedicated "Stage & verify sdk-js sample bundles" step below
# (honua-io/honua-samples#11) runs BEFORE the gallery build so an
# integrity-verification failure is attributed to its own clearly-named CI
# step and fails the deploy outright. Local builds can still degrade to the
# committed snapshot on a fetch failure, but production sets a runnable-app
# floor below, so Pages fails closed instead of deploying an empty gallery.
on:
  push:
    branches: [trunk]
    paths:
      - "site/**"
      - "samples/**"
      - "jobs/**"
      - "schemas/**"
      - "scripts/**"
      - "config/**"
      - "vendor/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  # A pull request runs the same build, staging and browser smoke as a deploy,
  # so a broken bundle build is red on the PR instead of on trunk. It never
  # uploads or deploys a Pages artifact.
  pull_request:
    paths:
      - "site/**"
      - "samples/**"
      - "jobs/**"
      - "schemas/**"
      - "scripts/**"
      - "config/**"
      - "vendor/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read # to best-effort download the latest run-samples.yml run-results artifact below
  pages: write
  id-token: write

concurrency:
  # Pull requests get their own group so they never cancel a trunk deploy.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SDK_PRODUCER_ENFORCE_LOCK: "1"
      SDKJS_ROOT: ${{ github.workspace }}/.sdk-producer/honua-sdk-js
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Read immutable SDK producer lock
        id: sdk-lock
        run: node scripts/emit-sdk-producer-lock.mjs

      - name: Checkout exact honua-sdk-js producer
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: honua-io/honua-sdk-js
          ref: ${{ steps.sdk-lock.outputs.revision }}
          path: .sdk-producer/honua-sdk-js
          persist-credentials: false

      - name: Verify SDK checkout lease
        run: test "$(git -C "$SDKJS_ROOT" rev-parse HEAD)" = "${{ steps.sdk-lock.outputs.revision }}"

      - name: Build local sdk-js sample bundles for gallery embedding
        id: local-bundles
        # Pages runs from a fresh checkout; local dist directories are not
        # present by default. Build only the known production-facing IDs that
        # require explicit local fallback to avoid runnable embed regressions.
        # Every build is its own log group, and a failure names the script and
        # its exit code instead of ending the step with a bare status.
        #
        # maplibre-quickstart ships in the vendored release as a fixture
        # replay. When the public demo answers, it is rebuilt against the
        # SDK's public-live First Map endpoint and replaces the vendored build
        # (SAMPLE_BUNDLES_LOCAL_OVERRIDE_IDS). When the demo does not answer,
        # the vendored fixture build is published unchanged.
        env:
          QUICKSTART_LIVE_ENDPOINT: https://demo.honua.io/rest/services/maui-parcels/FeatureServer/1
        run: |
          set -euo pipefail
          run_build() {
            local script="$1"
            echo "::group::npm run ${script}"
            local status=0
            npm --prefix "$SDKJS_ROOT" run "$script" --silent || status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error title=sdk-js bundle build failed::npm run ${script} exited ${status}"
              exit "$status"
            fi
          }
          if [ ! -d "$SDKJS_ROOT/node_modules" ]; then
            echo "::group::npm ci (honua-sdk-js)"
            npm --prefix "$SDKJS_ROOT" ci --silent
            echo "::endgroup::"
          fi
          override_ids=""
          if node -e '
            const endpoint = process.env.QUICKSTART_LIVE_ENDPOINT;
            fetch(`${endpoint}?f=json`, { signal: AbortSignal.timeout(15000) })
              .then(async (response) => {
                const body = await response.json();
                if (!response.ok || body.error || !body.geometryType) throw new Error(`HTTP ${response.status}`);
              })
              .catch((error) => { console.log(`public demo unavailable: ${error.message}`); process.exit(1); });
          '; then
            echo "Public demo answered; building maplibre-quickstart in public-live mode against $QUICKSTART_LIVE_ENDPOINT."
            VITE_HONUA_QUICKSTART_ENDPOINT="$QUICKSTART_LIVE_ENDPOINT" \
            VITE_HONUA_QUICKSTART_PROTOCOL="geoservices-feature-service" \
            VITE_HONUA_QUICKSTART_BASEMAP_STYLE="./__honua-quickstart__/basemap-style.json" \
              run_build demo:quickstart:build
            override_ids="maplibre-quickstart"
          else
            echo "::warning title=public demo unavailable::Publishing the vendored fixture build of maplibre-quickstart."
          fi
          echo "override_ids=${override_ids}" >> "$GITHUB_OUTPUT"
          for script in \
            demo:mcp-gis-assistant:build \
            demo:spatial-analytics:build \
            demo:edit-workflow:build \
            demo:geocoding:build \
            demo:oauth-signin:build \
            demo:service-explorer:build \
            demo:incident:build \
            demo:pmtiles-static:build \
            demo:nl-map-control:build \
            demo:app-bootstrap:build \
            demo:gp-runner:build \
            demo:web-components:build \
            demo:runtime-parity:build \
            demo:25d:build \
            demo:terrain-elevation:build \
            demo:unified-ops:build \
            demo:planning-workbench:build; do
            run_build "$script"
          done

      - name: Download latest run-results artifact (best effort)
        # Feeds scripts/build-gallery.mjs's honest per-sample run badges. Not
        # fatal if absent (no run-samples.yml run yet, or its artifact
        # already expired) -- the gallery then just shows "no run results
        # yet" for active samples instead of a badge, same as a local build.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow run-samples.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful run-samples.yml run found yet -- continuing without run-results."
            exit 0
          fi
          mkdir -p results
          if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n run-results -D results; then
            echo "Downloaded run-results artifact from run $run_id."
          else
            echo "Could not download the run-results artifact from run $run_id (may have expired) -- continuing without it."
          fi

      - name: Stage & verify sdk-js sample bundles
        # Reads the lock's content-addressed vendored release and SHA-256-verifies
        # every file against its manifest, and stages verified files outside
        # site/ (see scripts/lib/sample-bundles.mjs). Integrity or manifest
        # errors fail immediately. The production runnable-app floor also
        # makes a fetch failure fatal here; snapshot-only degraded mode stays
        # available to local development without that floor.
        env:
          SAMPLE_BUNDLES_MANIFEST_URL: ${{ steps.sdk-lock.outputs.bundle_manifest_url }}
          SAMPLE_BUNDLES_TARBALL_URL: ${{ steps.sdk-lock.outputs.bundle_archive_url }}
          SAMPLE_BUNDLES_LOCAL_SDKJS_ROOT: ${{ env.SDKJS_ROOT }}
          SAMPLE_BUNDLES_LOCAL_OVERRIDE_IDS: ${{ steps.local-bundles.outputs.override_ids }}
          SAMPLE_BUNDLES_LOCAL_SAMPLE_IDS: "mcp-gis-assistant,spatial-analytics-workbench,edit-workflow-demo,geocoding-quickstart,maplibre-quickstart,oauth-signin,app-bootstrap-basic,geoprocessing-job-runner,runtime-parity-showcase,storytelling-25d-map,terrain-rgb-elevation,unified-ops-workspace,web-components-basic,planning-permitting-workbench,service-explorer,nl-map-control,realtime-incident-dashboard,pmtiles-static"
          # Production must never publish a gallery with zero runnable apps.
          MIN_RUNNABLE_BUNDLES: "11"
        run: node scripts/lib/sample-bundles.mjs

      - name: Build gallery
        # KEY_LIST_URL is the published capability list at the 2026.1 server
        # pin, the same URL validate.yml and run-samples.yml fetch (see
        # scripts/lib/capability-keys.mjs). The sdk-js catalog fetch has its
        # own committed fallback (config/sdkjs-catalog.snapshot.json, see
        # scripts/lib/sdkjs-catalog.mjs). Sample bundle staging already ran
        # above -- this step's own call to
        # ensureSampleBundlesStaged() finds that cached result and reuses it
        # (no second network fetch), then copies the verified files into
        # site/sdk/<id>/app/ and renders the embed/no-bundle/headless panels.
        env:
          KEY_LIST_URL: https://raw.githubusercontent.com/honua-io/honua-server/8cb074f77d01c0a00617ebe426460aa24c7d890b/docs/gis/data/capability-keys.v1.json
          MIN_RUNNABLE_BUNDLES: "11"
        run: node scripts/build-gallery.mjs

      - name: Install gallery browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke the exact gallery artifact
        # Bundle supply is gated above. The publish floor is the named list in
        # config/required-published-apps.v1.json: every app it lists must be
        # runnable in this artifact (scripts/smoke-published-gallery.mjs).
        run: npm run test:gallery:browser

      - name: Verify server-first job pages
        env:
          MIN_JOB_PAGES: "4"
        run: npm run test:job-pages:browser

      - name: Upload gallery browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gallery-browser-smoke
          path: .artifacts/gallery-browser-smoke
          if-no-files-found: error

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - id: deployment
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify-live:
    name: verify deployed gallery
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install live-gallery browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify every admitted live route and runnable app
        env:
          GALLERY_BASE_URL: https://samples.honua.io
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: npm run test:gallery:live

      - name: Upload live-gallery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gallery-live-smoke
          path: .artifacts/gallery-live-smoke
          if-no-files-found: error
