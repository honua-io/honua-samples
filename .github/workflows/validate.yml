name: validate

on:
  pull_request:
    paths:
      - "samples/**"
      - "jobs/**"
      - "schemas/**"
      - "scripts/**"
      - "site/**"
      - "config/**"
      - "vendor/**"
      - "audits/**"
      - "generated/**"
      - "docs/release-certification.md"
      - ".github/workflows/validate.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [trunk]
    paths:
      - "samples/**"
      - "jobs/**"
      - "schemas/**"
      - "scripts/**"
      - "site/**"
      - "config/**"
      - "vendor/**"
      - "audits/**"
      - "generated/**"
      - "docs/release-certification.md"
      - ".github/workflows/validate.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate-manifests:
    name: validate sample manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate samples/*/sample.json
        # KEY_LIST_URL is the one-line swap point for the canonical capability
        # key list published by honua-io/honua-server#2893. Until that lands,
        # leaving it unset falls back to the pinned fixture at
        # schemas/fixtures/capability-keys.fixture.json (see the loud comment
        # in that file). Once the artifact exists, set this as a repo/org
        # variable -- no workflow or script edits needed beyond this one line.
        env:
          KEY_LIST_URL: ${{ vars.KEY_LIST_URL }}
        run: node scripts/validate-manifests.mjs

      - name: Validate release certification dossiers and generated outputs
        run: node scripts/release-certification.mjs check

      - name: Validate jobs/*.json
        run: npm run test:job-pages

  consumer-admission-tests:
    name: consumer admission and coverage boundary tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run node test suite
        # Network-independent (NFR-002 on honua-io/honua-samples#16): every
        # case works from the committed byte-exact sdk-js handoff snapshot
        # pair -- admission (tampered/stale/schema-incompatible/locally
        # reconstructed rejection), stable-identity dedup/merge, and the
        # samples-coverage evidence boundary (SDK-projected cards are
        # gallery-only and never counted in samples-coverage.v1.json).
        run: node --test "scripts/test/*.test.mjs"

  gallery-build-check:
    name: gallery build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build gallery in --check mode
        # Exercises the full samples.honua.io gallery build (honua-io/honua-samples#3)
        # against both inputs -- this repo's own samples/*/sample.json manifests
        # and the honua-sdk-js site-consumer handoff admitted through
        # scripts/lib/sdkjs-handoff.mjs (honua-io/honua-samples#16) -- and fails
        # the PR if either side has a problem the deploy-time build would
        # otherwise only warn about (e.g. an sdk-js card referencing a
        # capability key that isn't in the canonical key list), or if the
        # handoff pair is tampered, stale, schema-incompatible, or locally
        # reconstructed (admission failures are fatal in every mode).
        env:
          KEY_LIST_URL: ${{ vars.KEY_LIST_URL }}
        run: node scripts/build-gallery.mjs --check

  exact-head-browser:
    name: exact head gallery browser (11 apps / 4 jobs)
    runs-on: ubuntu-latest
    env:
      SDK_PRODUCER_ENFORCE_LOCK: "1"
      MIN_RUNNABLE_BUNDLES: "11"
      MIN_PUBLISHED_RUNNABLE_APPS: "11"
      MIN_JOB_PAGES: "4"
      EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Stage the vendored immutable SDK release
        run: node scripts/lib/sample-bundles.mjs

      - name: Build the exact-head gallery
        env:
          KEY_LIST_URL: ${{ vars.KEY_LIST_URL }}
        run: GITHUB_SHA="$EXPECTED_SOURCE_COMMIT" node scripts/build-gallery.mjs --check

      - name: Run every admitted SDK app
        run: npm run test:gallery:browser

      - name: Run exact-head gallery semantic canaries
        # Keep GALLERY_BASE_URL unset: the verifier serves this job's exact
        # generated site/ artifact locally and exercises packaged fixtures.
        run: npm run test:gallery:live

      - name: Run every admitted job page
        run: npm run test:job-pages:browser

      - name: Upload exact-head browser receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exact-head-gallery-browser
          path: .artifacts/gallery-browser-smoke
          if-no-files-found: error
