name: validate

on:
  pull_request:
    paths:
      - "samples/**"
      - "schemas/**"
      - "scripts/**"
      - "site/**"
      - "config/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [trunk]
    paths:
      - "samples/**"
      - "schemas/**"
      - "scripts/**"
      - "site/**"
      - "config/**"
      - ".github/workflows/validate.yml"

jobs:
  validate-manifests:
    name: validate sample manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate samples/*/sample.json
        # KEY_LIST_URL is the one-line swap point for the canonical capability
        # key list published by honua-io/honua-server#2893. Until that lands,
        # leaving it unset falls back to the pinned fixture at
        # schemas/fixtures/capability-keys.fixture.json (see the loud comment
        # in that file). Once the artifact exists, set this as a repo/org
        # variable -- no workflow or script edits needed beyond this one line.
        env:
          KEY_LIST_URL: ${{ vars.KEY_LIST_URL }}
        run: node scripts/validate-manifests.mjs

  gallery-build-check:
    name: gallery build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build gallery in --check mode
        # Exercises the full samples.honua.io gallery build (honua-io/honua-samples#3)
        # against both inputs -- this repo's own samples/*/sample.json manifests
        # and the honua-sdk-js catalog.v2.json projection -- and fails the PR if
        # either side has a problem the deploy-time build would otherwise only
        # warn about (e.g. an sdk-js catalog entry referencing a capability key
        # that isn't in the canonical key list, or missing a sourcePath).
        env:
          KEY_LIST_URL: ${{ vars.KEY_LIST_URL }}
        run: node scripts/build-gallery.mjs --check
