name: Gallery health

on:
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gallery-health.yml'
      - '.github/scripts/report-gallery-health.cjs'
      - 'scripts/*gallery-health*.mjs'
      - 'scripts/lib/gallery-health-*.mjs'
      - 'config/gallery-health.v1.json'
      - 'scripts/test/gallery-health.test.mjs'

permissions:
  contents: read

concurrency:
  group: gallery-health-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'nightly' }}
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/test/gallery-health.test.mjs
      - run: npx playwright install --with-deps chromium firefox
      - name: Prove blank map, console error and dead link fail with screenshots
        run: xvfb-run -a node scripts/smoke-gallery-health-controls.mjs
      - name: Check published galleries signed out
        if: github.event_name != 'pull_request'
        run: xvfb-run -a node scripts/check-gallery-health.mjs
      - name: Publish readable result
        if: always()
        run: |
          if test -f .artifacts/gallery-health/latest.md; then
            cat .artifacts/gallery-health/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep screenshots and machine-readable results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gallery-health
          path: .artifacts/gallery-health*
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Update the single public health tracking issue
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await require('./.github/scripts/report-gallery-health.cjs')({ github, context });
