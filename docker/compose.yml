# Composed stack for the headless sample runner (see scripts/run-samples.mjs
# and .github/workflows/run-samples.yml).
#
# 2026.1 default is the platform-manifest candidate
# (components.honua-server image nightly-8cb074f, digest sha256:2d7877c4…),
# with licensing disabled. HONUA_SERVER_IMAGE may override the image. The
# floating :trunk tag is not this release.
services:
  postgres:
    image: pgrouting/pgrouting:17-3.5-3.7.3
    environment:
      POSTGRES_DB: honua_dev
      POSTGRES_USER: honua_user
      POSTGRES_PASSWORD: honua_password
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      # Probe over TCP. The image's init phase runs a temporary server on the
      # Unix socket only, then restarts it; a socket probe reports healthy
      # during that window and honua's one-shot migration hits the restart.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U honua_user -d honua_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  honua:
    image: "${HONUA_SERVER_IMAGE:-ghcr.io/honua-io/honua-server:nightly-8cb074f@sha256:2d7877c4d1cb3b30647fb225893d41b13728f0448997997cdf4bf40fe99be07d}"
    ports:
      - "${HONUA_HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Licensing__Mode: Disabled
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=honua_dev;Username=honua_user;Password=honua_password"
      HONUA_ADMIN_PASSWORD: "${HONUA_ADMIN_PASSWORD:-quickstart-admin-password}"
      Security__ConnectionEncryption__MasterKey: "${HONUA_CONNECTION_ENCRYPTION_MASTER_KEY:-honua-samples-ci-master-key-0123456789}"
      Security__ConnectionEncryption__Salt: "${HONUA_CONNECTION_ENCRYPTION_SALT:-aG9udWEtc2FtcGxlcy1jaS1zYWx0LTIwMjY=}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Kestrel__Endpoints__Http__Url: "http://+:8080"
      Kestrel__Endpoints__Http__Protocols: "Http1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
