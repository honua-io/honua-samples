# Optional compose overlay. 2026.1 does not use it to grant an edition.
#
# The base stack sets Licensing__Mode=Disabled. This overlay repeats that so
# stacking the file cannot turn licensing on or install Licensing__DevGrantEdition.
# scripts/run-samples.mjs --edition only decides which manifest editions the
# runner executes; it is not a server license.
services:
  honua:
    environment:
      Licensing__Mode: Disabled
