<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Query a FeatureServer</title>
  <style>
    body { max-width: 52rem; margin: 3rem auto; padding: 0 1.25rem; font: 16px/1.55 Georgia, serif; color: #17221c; background: #f4f1e8; }
    pre { overflow: auto; padding: 1rem; border: 1px solid #b9b5a8; background: #fffdf6; }
    [data-state="pass"] { color: #17633a; }
    [data-state="fail"] { color: #a12b1f; }
  </style>
</head>
<body>
  <h1>Query a public FeatureServer</h1>
  <p id="status">Loading three building features...</p>
  <pre id="output" aria-live="polite"></pre>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const baseUrl = params.get("baseUrl") ?? "https://demo.honua.io";
    const serviceName = "maui-buildings";
    const status = document.querySelector("#status");
    const output = document.querySelector("#output");

    async function getJson(path) {
      const response = await fetch(`${baseUrl}${path}`);
      const body = await response.json();
      if (!response.ok || body.error) {
        throw new Error(body.error?.message ?? `HTTP ${response.status}`);
      }
      return body;
    }

    try {
      const service = await getJson(`/rest/services/${serviceName}/FeatureServer?f=json`);
      const layer = service.layers?.[0];
      if (!layer) throw new Error("The service did not advertise a layer.");

      const query = new URLSearchParams({
        where: "1=1",
        outFields: "*",
        returnGeometry: "true",
        resultRecordCount: "3",
        f: "json",
      });
      const result = await getJson(
        `/rest/services/${serviceName}/FeatureServer/${layer.id}/query?${query}`,
      );
      if (result.features?.length !== 3) {
        throw new Error(`Expected 3 features, received ${result.features?.length ?? 0}.`);
      }

      status.textContent = `PASS: ${serviceName}/FeatureServer/${layer.id} returned 3 features.`;
      status.dataset.state = "pass";
      output.textContent = JSON.stringify(result.features, null, 2);
      document.body.dataset.sampleStatus = "pass";
    } catch (error) {
      status.textContent = `FAIL: ${error.message}`;
      status.dataset.state = "fail";
      document.body.dataset.sampleStatus = "fail";
      document.body.dataset.sampleError = error.message;
    }
  </script>
</body>
</html>
